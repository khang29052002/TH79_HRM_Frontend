# =====================================================
# TH79 HRM Frontend - CI Pipeline
# Chạy trên mọi push/PR vào develop và main
# =====================================================
name: CI - Build & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Develop branch build dùng API staging, main dùng production
          VITE_API_URL: ${{ github.ref_name == 'main' && secrets.VITE_API_URL_PROD || secrets.VITE_API_URL_STAGING }}

      - name: Check bundle size
        run: |
          echo "=== Build Output Size ==="
          du -sh dist/
          echo ""
          echo "=== Largest files (top 10) ==="
          find dist/ -type f -exec du -h {} + | sort -rh | head -10

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}-${{ github.sha }}
          path: dist/
          retention-days: 3